];

/* ---------- сценарии ---------- */
const FLOWS = [
  { id:'positions', title:'Позиции (онлайн)',
    edges:['e2','e3','e5','e9','e12','e11'], nodes:['F1','F2','B1','B2','B4','S1','E1'],
    desc:'Открытие таблицы или страницы инструмента: /api/v1 → DataService → ArchiveProvider. Тёплая дата отдаётся из SQLite за ~20 мс; недостающее докачивается с web.moex.com и остаётся в архиве навсегда. Самая свежая дата всегда перепроверяется — из-за лага публикации (~1 торговый день).' },
  { id:'prices', title:'Цены активов',
    edges:['e2','e3','e5','e13','e14'], nodes:['F1','F2','B1','B2','E2','S1'],
    desc:'Линия цены на графиках: DataService берёт цены закрытия из ISS MOEX (акции — доска TQBR, индексы — SNDX) и сохраняет в prices. Повторные запросы того же периода — из архива; индексным фьючерсам соответствует сам индекс (MIX/MXI → IMOEX, RTSM → RTS).' },
  { id:'sync', title:'Фоновая синхронизация',
    edges:['e7','e8','e9','e11','e12'], nodes:['B7','B6','B2','B4','E1','S1'],
    desc:'При старте и каждые 900 секунд: полный срез по всем 68 инструментам на последнюю дату и агрегаты за 30 торговых дней. Срез считается полным, если число тикеров совпадает со списком инструментов на эту дату; неполный добирается по тикерам.' },
  { id:'backfill', title:'Ленивый бэкфилл',
    edges:['e2','e3','e5','e9','e11','e12'], nodes:['F1','F2','B1','B2','B4','E1','S1'],
    desc:'Первый просмотр длинной истории: недостающие торговые дни докачиваются с биржи (даты последовательно, инструменты параллельно) и остаются в базе навсегда. 90 торговых дней: ~3 с при докачке → ~20 мс из архива. Длинные периоды сэмплируются и кэшируются.' },
  { id:'fallback', title:'Фолбэк на demo',
    edges:['e10'], nodes:['B2','B5'],
    desc:'Биржа недоступна или FP_DATA_SOURCE=demo: DataService уходит на детерминированный демо-провайдер (синтетические позиции и цены). В интерфейсе загорается бейдж «демо»; на этом же провайдере офлайн выполняются все 19 автотестов.' }
];

const LEGEND = [
  { style:'plain', text:'вызов / HTTP-запрос' },
  { style:'conf',  text:'конфигурация FP_*' },
  { style:'store', text:'чтение / запись SQLite', both:true },
  { style:'ext',   text:'внешняя сеть (пунктир) · фолбэк — красный пунктир' }
];

const OVERVIEW = `
  <h2>moex-futures-positions</h2>
  <span class="badge" style="background:#e8f0fe;color:#2563eb">обзор</span>
  <p>Веб-сервис «Позиции по фьючерсам на акции и индексы — MOEX»: открытые/закрытые позиции
  физлиц и юрлиц по 68 фьючерсам + цены базовых активов, с SQLite-архивом истории.</p>
  <h4>Как пользоваться схемой</h4>
  <ul>
    <li>Клик по узлу — назначение, файлы и ключевые факты.</li>
    <li>Клик по сценарию в шапке — подсветка маршрута.</li>
    <li>Колесо — зум, перетаскивание — панорама, PNG — экспорт.</li>
  </ul>
  <h4>Ключевые числа</h4>
  <ul>
    <li>68 инструментов · архив с 2021-09</li>
    <li>23 170 точек · 1 273 даты в базе</li>
    <li>бэкенд: 19 тестов · фронт: tsc без ошибок</li>
  </ul>
  <p class="rel">Схема соответствует коду репозитория на 2026-10-04. Данные — не инвестиционная рекомендация.</p>`;

/* ---------- состояние ---------- */
const state = { theme:'light', flow:null, sel:null, k:1, x:0, y:0 };
const svg = document.getElementById('diagram');
const panel = document.getElementById('panel');
const byId = {}; NODES.forEach(n => byId[n.id] = n);

/* ---------- построение SVG ---------- */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function render(){
  const P = PALETTES[state.theme];
  svg.setAttribute('font-family', '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif');
  let defs = '';
  ['edge','amber','red','blue'].forEach(c => {
    defs += `<marker id="arw-${c}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${P[c==='edge'?'edge':c]}"/></marker>`;
  });

  let s = `<defs>${defs}</defs>`;
  s += `<rect x="0" y="0" width="1560" height="980" fill="${P.bg}"/>`;
  s += `<g id="world">`;

  /* слои */
  BANDS.forEach(b => {
    s += `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="14" fill="${P[b.fill]}"
      stroke="${P[b.stroke]}" stroke-width="1.4" ${b.dashed?'stroke-dasharray="7 5"':''} pointer-events="none"/>`;
    s += `<text x="${b.x+18}" y="${b.y+24}" font-size="10.5" font-weight="700" letter-spacing="1" fill="${P.bandTitle}">${esc(b.title)}</text>`;
  });

  /* связи */
  EDGES.forEach(e => {
    const col = e.style==='conf' ? P.edge : e.style==='store' ? P.amber : e.style==='ext' ? P.red : e.style==='fall' ? P.red : P.edge;
    const dash = (e.style==='conf'||e.style==='ext'||e.style==='fall') ? 'stroke-dasharray="6 5"' : '';
    const mk = e.style==='store' ? `marker-start="url(#arw-amber)" marker-end="url(#arw-amber)"` : `marker-end="url(#arw-${e.style==='ext'||e.style==='fall'?'red':'edge'})"`;
    s += `<g class="edge" data-id="${e.id}">
      <path d="${e.d}" fill="none" stroke="${P.bg}" stroke-width="9" stroke-opacity="0" pointer-events="stroke" class="hit"/>
      <path class="line" d="${e.d}" fill="none" stroke="${col}" stroke-width="1.7" ${dash} ${mk}/>
      <title>${esc((byId[e.a].title)+' → '+byId[e.b].title+'. '+e.desc)}</title></g>`;
    if (e.label){
      const [txt,lx,ly,anchor] = e.label;
      s += `<text class="elabel" data-for="${e.id}" x="${lx}" y="${ly}" font-size="10.5" fill="${P.label}"
        text-anchor="${anchor||'middle'}" paint-order="stroke" stroke="${P.bg}" stroke-width="4" stroke-linejoin="round">${esc(txt)}</text>`;
    }
  });

  /* узлы */
  NODES.forEach(n => {
    s += `<g class="node" data-id="${n.id}" style="cursor:pointer">
      <rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="11" fill="${P.node}"
        stroke="${P[n.layer]}" stroke-width="1.6" style="filter:drop-shadow(0 2px 5px ${P.nodeShadow})"/>
      <line x1="${n.x}" y1="${n.y+14}" x2="${n.x}" y2="${n.y+n.h-14}" stroke="${P[n.layer]}" stroke-width="3" stroke-linecap="round"/>
      <text x="${n.x+16}" y="${n.y+25}" font-size="13.5" font-weight="650" fill="${P.title}">${esc(n.title)}</text>`;
    const baseY = n.y + 44;
    (n.subs||[]).forEach((sub,i) => {
      const mono = sub[1];
      s += `<text x="${n.x+16}" y="${baseY+i*15}" font-size="${mono?10:10.5}" fill="${P.sub}"
        font-family="${mono?'ui-monospace,Menlo,Consolas,monospace':'inherit'}">${esc(sub[0])}</text>`;
    });
    (n.pills||[]).forEach((p,i) => {
      const w = p.length*5.4+14, px = n.x+16 + (i===1 ? (n.pills[0].length*5.4+14)+8 : 0);
      s += `<rect x="${px}" y="${n.y+n.h-22}" width="${w}" height="16" rx="8" fill="${P.pillBg}" stroke="${P.pillBd}"/>
        <text x="${px+w/2}" y="${n.y+n.h-10.5}" font-size="9.5" fill="${P.pillTx}" text-anchor="middle">${esc(p)}</text>`;
    });
    s += `<title>${esc(n.title+'. '+n.desc)}</title></g>`;
  });

  /* легенда */
  s += `<g pointer-events="none">
    <rect x="580" y="720" width="510" height="150" rx="14" fill="${P.legend}" stroke="${P.legends}"/>
    <text x="600" y="746" font-size="10.5" font-weight="700" letter-spacing="1" fill="${P.bandTitle}">ЛЕГЕНДА</text>`;
  LEGEND.forEach((l,i) => {
    const y = 770 + i*24;
    const col = l.style==='store' ? P.amber : l.style==='ext' ? P.red : P.edge;
    const dash = (l.style==='conf'||l.style==='ext') ? 'stroke-dasharray="6 5"' : '';
    const mk = l.both ? 'marker-start="url(#arw-amber)" marker-end="url(#arw-amber)"' : `marker-end="url(#arw-${l.style==='ext'?'red':'edge'})"`;
    s += `<line x1="600" y1="${y}" x2="650" y2="${y}" stroke="${col}" stroke-width="1.7" ${dash} ${mk}/>
      <text x="662" y="${y+3.5}" font-size="11" fill="${P.sub}">${esc(l.text)}</text>`;
  });
  s += `<text x="600" y="856" font-size="11" fill="${P.sub}">Пунктирная рамка — граница доверия: внешние API биржи</text></g>`;

  /* футер */
  s += `<text x="40" y="948" font-size="11" fill="${P.foot}">Схема соответствует коду репозитория на 2026-10-04 · backend: uv run pytest (19) · frontend: tsc -b · make dev — запуск, make stop — гасит осиротевшие процессы</text>`;

  s += `</g>`;
  svg.innerHTML = s;
  applyView(); applyHighlight(); bindSvg();
}

/* ---------- подсветка ---------- */
function applyHighlight(){
  const P = PALETTES[state.theme];
  const flow = state.flow ? FLOWS.find(f=>f.id===state.flow) : null;
  const onE = new Set(flow ? flow.edges : []), onN = new Set(flow ? flow.nodes : []);
  const sel = state.sel;
  svg.querySelectorAll('g.node').forEach(g => {
    const id = g.dataset.id;
    const dim = flow && !onN.has(id);
    g.style.opacity = dim ? .16 : 1;
    const r = g.querySelector('rect');
    if (!r.dataset.st) r.dataset.st = r.getAttribute('stroke');
    const isSel = !flow && sel && sel.type==='node' && sel.id===id;
    r.setAttribute('stroke-width', isSel ? 2.8 : 1.6);
    r.setAttribute('stroke', isSel ? P.blue : r.dataset.st);
  });
  svg.querySelectorAll('g.edge').forEach(g => {
    const on = flow ? onE.has(g.dataset.id) : true;
    const isSel = !flow && sel && sel.type==='edge' && sel.id===g.dataset.id;
    const line = g.querySelector('.line');
    g.style.opacity = (flow && !on) ? .14 : 1;
    if (!line.dataset.st) line.dataset.st = line.getAttribute('stroke');
    if (!line.dataset.mk) line.dataset.mk = line.getAttribute('marker-end') || '';
    if (!line.dataset.mks) line.dataset.mks = line.getAttribute('marker-start') || '';
    const active = (flow && on) || isSel;
    line.setAttribute('stroke-width', active ? 3 : 1.7);
    line.setAttribute('stroke', active ? P.blue : line.dataset.st);
    if (active){
      line.setAttribute('marker-end', 'url(#arw-blue)');
      if (line.dataset.mks) line.setAttribute('marker-start', 'url(#arw-blue)');
    } else {
      if (line.dataset.mk) line.setAttribute('marker-end', line.dataset.mk);
      else line.removeAttribute('marker-end');
      if (line.dataset.mks) line.setAttribute('marker-start', line.dataset.mks);
    }
  });
  svg.querySelectorAll('text.elabel').forEach(t => {
    const on = flow ? onE.has(t.dataset.for) : true;
    t.style.opacity = (flow && !on) ? .14 : 1;
    t.setAttribute('fill', (flow && on) ? P.blue : P.label);
  });
}

/* ---------- панель ---------- */
function showPanel(html){ panel.innerHTML = html; }

function selectNode(id){
  state.sel = {type:'node', id}; state.flow = null; syncChips();
  const n = byId[id];
  const L = {tF:'фронтенд', tB:'бэкенд', tS:'хранилище', tE:'внешний API'}[n.layer];
  const col = PALETTES[state.theme][n.layer];
  const inc = EDGES.filter(e=>e.b===id), out = EDGES.filter(e=>e.a===id);
  showPanel(`
    <h2>${esc(n.title)}</h2>
    <span class="badge" style="background:${col}22;color:${col};border:1px solid ${col}55">${L}</span>
    <p>${esc(n.desc)}</p>
    <h4>Файлы</h4><div class="files">${esc(n.files)}</div>
    <h4>Факты</h4><ul>${n.facts.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>
    ${inc.length?`<h4>Связи</h4><p class="rel">${inc.map(e=>`◀ ${esc(byId[e.a].title)}`).join('<br>')}${out.length?'<br>':''}${out.map(e=>`${esc(byId[e.b].title)} ▶`).join('<br>')}</p>`:''}
  `);
  applyHighlight();
}

function selectFlow(id){
  state.flow = id; state.sel = null; syncChips();
  const f = FLOWS.find(x=>x.id===id);
  showPanel(`
    <h2>Сценарий: ${esc(f.title)}</h2>
    <span class="badge" style="background:#2563eb22;color:#2563eb;border:1px solid #2563eb55">маршрут</span>
    <p>${esc(f.desc)}</p>
    <h4>Участники</h4>
    <p class="rel">${f.nodes.map(nid=>esc(byId[nid].title)).join(' → ')}</p>
  `);
  applyHighlight();
}

function resetSel(){ state.sel=null; state.flow=null; syncChips(); showPanel(OVERVIEW); applyHighlight(); }

/* ---------- зум/панорама ---------- */
function applyView(){
  svg.querySelector('#world').setAttribute('transform', `translate(${state.x},${state.y}) scale(${state.k})`);
}
function svgPoint(ev){
  const m = svg.getScreenCTM().inverse();
  const q = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(m);
  return { x:q.x, y:q.y };
}
function zoomAt(f, pt){
  const k2 = Math.min(4, Math.max(.5, state.k*f));
  const wx = (pt.x-state.x)/state.k, wy = (pt.y-state.y)/state.k;
  state.x = pt.x - wx*k2; state.y = pt.y - wy*k2; state.k = k2; applyView();
}
function bindSvg(){
  svg.onwheel = ev => { ev.preventDefault(); zoomAt(Math.exp(-ev.deltaY*0.0012), svgPoint(ev)); };
  let drag = null;
  svg.onpointerdown = ev => {
    if (ev.target.closest('g.node') || ev.target.closest('g.edge')) return;
    const pt = svgPoint(ev);
    drag = { pt, x:state.x, y:state.y };
    svg.classList.add('panning'); svg.setPointerCapture(ev.pointerId);
  };
  svg.onpointermove = ev => {
    if (!drag) return;
    const pt = svgPoint(ev);
    state.x = drag.x + (pt.x - drag.pt.x);
    state.y = drag.y + (pt.y - drag.pt.y);
    applyView();
  };
  svg.onpointerup = svg.onpointercancel = () => { drag=null; svg.classList.remove('panning'); };

  svg.querySelectorAll('g.node').forEach(g => {
    g.addEventListener('click', ev => { ev.stopPropagation(); selectNode(g.dataset.id); });
  });
  svg.querySelectorAll('g.edge').forEach(g => {
    g.addEventListener('click', ev => {
      ev.stopPropagation();
      const e = EDGES.find(x=>x.id===g.dataset.id);
      state.sel = {type:'edge', id:e.id}; state.flow = null; syncChips(); applyHighlight();
      showPanel(`
        <h2>${esc(byId[e.a].title)} → ${esc(byId[e.b].title)}</h2>
        <span class="badge" style="background:#33415518;color:#64748b;border:1px solid #94a3b855">связь</span>
        <p>${esc(e.desc)}</p>`);
    });
  });
}

/* ---------- шапка ---------- */
const chipsBox = document.getElementById('chips');
FLOWS.forEach(f => {
  const c = document.createElement('div');
  c.className = 'chip'; c.textContent = f.title; c.dataset.flow = f.id;
  c.onclick = () => state.flow===f.id ? resetSel() : selectFlow(f.id);
  chipsBox.appendChild(c);
});
function syncChips(){
  chipsBox.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.flow===state.flow));
}

document.getElementById('btnReset').onclick = resetSel;
document.getElementById('btnFit').onclick = () => { state.k=1; state.x=0; state.y=0; applyView(); };
document.getElementById('btnZoomIn').onclick  = () => zoomAt(1.25, {x:780,y:490});
document.getElementById('btnZoomOut').onclick = () => zoomAt(.8,  {x:780,y:490});
document.getElementById('btnTheme').onclick = function(){
  state.theme = state.theme==='light' ? 'dark' : 'light';
  document.body.classList.toggle('dark', state.theme==='dark');
  this.textContent = state.theme==='light' ? '🌙' : '☀️';
  render();
};

document.getElementById('btnPng').onclick = () => {
  const P = PALETTES[state.theme];
  const clone = svg.cloneNode(true);
  clone.querySelector('#world').setAttribute('transform','');
  clone.setAttribute('width', 1560); clone.setAttribute('height', 980);
  const xml = new XMLSerializer().serializeToString(clone);
  const url = URL.createObjectURL(new Blob([xml], {type:'image/svg+xml;charset=utf-8'}));
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas');
    cv.width = 3120; cv.height = 1960;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = P.bg; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    const a = document.createElement('a');
    a.download = 'moex-futures-positions-architecture.png';
    a.href = cv.toDataURL('image/png'); a.click();
  };
  img.src = url;
};

/* ---------- старт ---------- */
window.addEventListener('hashchange', () => {
  const m = location.hash.match(/flow=([a-z]+)/);
  if (m && FLOWS.some(f=>f.id===m[1])) selectFlow(m[1]); else resetSel();
});
const m0 = location.hash.match(/flow=([a-z]+)/);
if (m0 && FLOWS.some(f=>f.id===m0[1])) state.flow = m0[1];
if (location.hash.includes('dark')) { state.theme='dark'; document.body.classList.add('dark');
  document.getElementById('btnTheme').textContent='☀️'; }
render();
if (state.flow) selectFlow(state.flow); else showPanel(OVERVIEW);
</script>
</body>
</html>
